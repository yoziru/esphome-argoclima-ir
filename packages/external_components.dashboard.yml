# Device Builder builds fetch the components from git at the ref selected by
# the device configuration (${argoclima_ir_ref}: a branch, tag, or commit SHA).
external_components:
  - components: [argo_ulisse]
    source:
      type: git
      url: https://github.com/yoziru/esphome-argoclima-ir.git
      ref: ${argoclima_ir_ref}
      path: components
