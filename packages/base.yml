substitutions:
  friendly_name: Argoclima Ulisse 13 DCI
  device_name: argoclima-ir
  device_description: ESPHome IR remote for Argo Ulisse 13 WREM-3

packages:
  board: !include board.yml
  climate: !include climate.yml
  common: !include common.yml
  project: !include project.yml
  external_components: !include external_components.yml

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  comment: ${device_description}

logger: !include logger.yml

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 802.11k/v roaming assistance (inert on networks without k/v support)
  enable_rrm: true
  enable_btm: true
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: !secret wifi_hotspot_password

captive_portal:
improv_serial:

web_server:
  ota: false
  local: true
