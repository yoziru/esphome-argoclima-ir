# Mirrors the configuration materialized by ESPHome Device Builder for an adopted device.
substitutions:
  name: argoclima-ir-dashboard-test
  friendly_name: Argoclima IR Dashboard Test
  ota_password: !secret test_ota_password

packages:
  argoclima_ir: !include ../argoclima-ir-m5stack-nanoc6.dashboard.yml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret test_api_encryption_key

wifi:
  ssid: !secret test_wifi_ssid
  password: !secret test_wifi_password
