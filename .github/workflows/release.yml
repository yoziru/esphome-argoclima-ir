name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit version override (X.Y.Z)
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run releases from main only" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          release_arg="$INPUT_VERSION"
          if [ -z "$release_arg" ]; then
            release_arg="$INPUT_BUMP"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/release.sh "$release_arg"

      # GITHUB_TOKEN pushes do not trigger other workflows, so publish the tag explicitly.
      - name: Publish released firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref "$(git describe --tags --abbrev=0)"
